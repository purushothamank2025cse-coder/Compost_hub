<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment - CompostHub</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav>
  <a href="/">Dashboard</a>
  <a href="/product">Products</a>
  <a href="/inventory">Inventory</a>
  <a href="/waste">Waste Intake</a>
  <a href="/purchase">Purchases</a>
  <a href="/sales">Sales</a>
  <a href="/processing">Processing</a>
  <a href="/digester">Digesters</a>
  <a href="/budget">Budgets</a>
  <a href="/reports">Reports</a>
</nav>
<main class="container narrow">
  <div class="page-head"><div><h1 th:text="${payment.id == null ? 'Add ' : 'Edit '} + 'Payment'"></h1><p>Enter the record details below.</p></div></div>
  <form class="card form-grid" th:action="@{/payment/save}" th:object="${payment}" method="post">
    <input type="hidden" th:field="*{id}">
    <label>Name<input type="text" th:field="*{name}" required></label>
    <label>Status<select th:field="*{status}"><option value="">New</option><option value="Active">Active</option><option value="Pending">Pending</option><option value="Completed">Completed</option><option value="Cancelled">Cancelled</option></select></label>
    <label>Quantity<input type="number" step="0.01" th:field="*{quantity}"></label>
    <label>Amount<input type="number" step="0.01" th:field="*{amount}"></label>
    <label class="full">Description<textarea th:field="*{description}" rows="5"></textarea></label>
    <div class="full form-actions"><a class="button secondary" href="/payment">Cancel</a><button class="button" type="submit">Save</button></div>
  </form>
</main>
</body></html>
